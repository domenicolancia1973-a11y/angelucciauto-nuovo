<html lang="it">
<head>

  <title>Acquisto Auto – Angelucci Domenico Auto</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --red:#c0392b;--red-dark:#96281b;--red-glow:rgba(192,57,43,0.15);
      --dark:#0c0c0c;--dark2:#141414;--dark3:#1e1e1e;--dark4:#252525;
      --gold:#c9a84c;--gold-light:#e8c96a;
      --white:#fff;--light:#f0ede8;--gray:#888;
      --radius:8px;
      --font-head:'Barlow Condensed',sans-serif;
      --font-body:'Barlow',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--dark);color:var(--light);line-height:1.7;overflow-x:hidden}

    /* ── NAV (COPIATA ESATTAMENTE DAL TUO CODICE) ── */
    nav{position:sticky;top:0;z-index:100;background:rgba(12,12,12,.97);backdrop-filter:blur(14px);border-bottom:1px solid #1f1f1f;padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:72px}
    
    .nav-logo img{
        height:58px;
        width:auto;
        display:block;
    }

    .nav-links{display:flex;align-items:center;gap:2rem;list-style:none}
    .nav-links a{font-family:var(--font-head);font-size:1rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#888;text-decoration:none;transition:color .2s}
    .nav-links a:hover,.nav-links a.active{color:var(--white)}
    .nav-links a.active{border-bottom:2px solid var(--red);padding-bottom:2px}

    .btn-wa{display:flex;align-items:center;gap:8px;background:#25d366;color:#fff!important;padding:9px 20px;border-radius:999px;font-family:var(--font-head)!important;font-size:.95rem!important;font-weight:700!important;text-decoration:none;transition:background .2s,transform .15s;white-space:nowrap}
    .btn-wa:hover{background:#1ebe5d;transform:scale(1.03)}
    .btn-wa svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
    .nav-burger{display:none;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer}

    /* ── HERO ACQUISTO AUTO ── */
    .hero{
      position:relative; min-height:82vh;
      display:grid; grid-template-columns:1fr 1fr;
      align-items:center; overflow:hidden;
    }
    .hero-bg{
      position:absolute; inset:0;
      background: linear-gradient(135deg, #0c0c0c 0%, #141414 50%, #0c0c0c 100%);
      z-index:0;
    }
    .hero-copy{position:relative; z-index:2; padding:5rem 3rem 5rem 4rem}
    .hero h1{
      font-family:var(--font-head); font-size:clamp(3rem,5.5vw,5rem);
      font-weight:800; line-height:1.0; color:var(--white);
      margin-bottom:1rem;
    }
    .hero h1 .accent{color:var(--red); display:block}
    .hero-sub{font-size:1.1rem; font-weight:300; font-style:italic; color:#bbb; max-width:420px; margin-bottom:2.2rem;}

    .btn-primary{
      display:inline-flex; align-items:center; gap:.5rem;
      background:var(--red); color:#fff;
      font-family:var(--font-head); font-size:1rem; font-weight:700;
      letter-spacing:.08em; text-transform:uppercase; text-decoration:none;
      padding:14px 30px; border-radius:var(--radius);
      transition:0.2s;
    }
    .btn-primary:hover{background:var(--red-dark); transform:translateY(-2px); box-shadow:0 8px 24px rgba(192,57,43,.3)}

    .hero-visual{position:relative; z-index:2; display:flex; align-items:center; justify-content:center; padding:2rem}
    .hero-img-wrap{position:relative; width:100%; max-width:520px; border-radius:12px; overflow:hidden; border:1px solid rgba(201,168,76,.25);}
    .hero-img-wrap img{width:100%; height:480px; object-fit:cover; display:block;}

    @media(max-width:900px){
      nav{padding:0 1.2rem}
      .hero{grid-template-columns:1fr;}
      .hero-copy{padding:3rem 1.5rem 2rem; text-align:center}
      .hero-visual{padding:0 1.5rem 2rem}
    }
  </style>
</head>
