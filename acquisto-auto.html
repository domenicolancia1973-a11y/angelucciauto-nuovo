<head>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --red:#c0392b; --dark:#090909; --dark2:#101010; --white:#fff;
      --blue:#3498db; --gray:#888;
      --font-head:'Barlow Condensed',sans-serif;
      --font-body:'Barlow',sans-serif;
    }
    body{font-family:var(--font-body);background:var(--dark);color:#edf1f5;line-height:1.7;overflow-x:hidden}

    /* ── NAV IDENTICA AL TUO CODICE ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9, 9, 9, 0.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #1a1a1a;
      padding: 0 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
    }
.nav-logo img {
    height: 58px;
    width: auto;
    display: block;
    /* Questo filtro mantiene i colori ma spinge le parti chiare/grigie al bianco puro */
    filter: brightness(1.5) contrast(1.2) saturate(1.5);
    image-rendering: -webkit-optimize-contrast;
}
    
    .nav-links {
      display: flex; align-items: center; gap: 1.8rem; list-style: none;
    }

    .nav-links a {
      font-family: var(--font-head);
      font-size: .95rem; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      color: #666; text-decoration: none;
      transition: color .2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .nav-links a.active { border-bottom: 2px solid var(--red); padding-bottom: 2px; }

    .btn-wa {
      display: flex; align-items: center; gap: 8px;
      background: #25d366; color: #fff !important;
      padding: 9px 18px; border-radius: 999px;
      font-family: var(--font-head) !important;
      font-size: .9rem !important; font-weight: 700 !important;
      text-decoration: none;
      transition: background .2s, transform .15s;
      white-space: nowrap;
    }
    .btn-wa:hover { background: #1ebe5d; transform: scale(1.03); }
    .btn-wa svg { width: 17px; height: 17px; fill: #fff; flex-shrink: 0; }

    /* ── HERO ── */
    .hero { position: relative; min-height: 85vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 2rem 4rem; }
    .hero h1 { font-family: var(--font-head); font-size: clamp(3rem, 5.5vw, 5rem); font-weight: 800; line-height: 0.95; color: var(--white); margin-bottom: 1.5rem; }
    .hero h1 span { color: var(--red); display: block; }
    .hero-sub { font-size: 1.1rem; color: #999; max-width: 480px; margin-bottom: 2.5rem; }
    
    .btn-primary { display: inline-flex; align-items: center; padding: 16px 35px; background: var(--red); color: #fff; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; text-decoration: none; border-radius: 8px; transition: 0.2s; }
    .btn-primary:hover { background: #a93226; transform: translateY(-2px); }

    .hero-visual img { width: 100%; max-width: 550px; border-radius: 15px; border: 1px solid #1e1e1e; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

    footer { text-align: center; padding: 3rem; background: #060606; border-top: 1px solid #141414; color: #444; font-size: 0.8rem; }

    @media(max-width:1000px) {
      .hero { grid-template-columns: 1fr; text-align: center; padding: 2rem 1.5rem; }
      nav { padding: 0 1.2rem; }
    }
  </style>
