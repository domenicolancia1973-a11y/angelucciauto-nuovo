<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Officina Meccanica – Angelucci Domenico Auto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#3498db;--blue-dark:#2980b9;--blue-glow:rgba(52,152,219,.12);
      --red:#c0392b;--red-dark:#96281b;
      --dark:#090909;--dark2:#101010;--dark3:#181818;--dark4:#202020;
      --white:#fff;--light:#edf1f5;--gray:#888;
      --radius:8px;
      --font-head:'Barlow Condensed',sans-serif;
      --font-body:'Barlow',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--dark);color:var(--light);line-height:1.7;overflow-x:hidden}

    /* ── NAV ── */
    nav{position:sticky;top:0;z-index:100;background:rgba(9,9,9,.97);backdrop-filter:blur(14px);border-bottom:1px solid #1a1a1a;padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:72px}
    .nav-logo img{height:58px;width:auto;display:block}
    .nav-links{display:flex;align-items:center;gap:1.8rem;list-style:none}
    .nav-links a{font-family:var(--font-head);font-size:.95rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#666;text-decoration:none;transition:color .2s}
    .nav-links a:hover,.nav-links a.active{color:var(--white)}
    .nav-links a.active{border-bottom:2px solid var(--blue);padding-bottom:2px}
    .btn-wa{display:flex;align-items:center;gap:8px;background:#25d366;color:#fff!important;padding:9px 18px;border-radius:999px;font-family:var(--font-head)!important;font-size:.9rem!important;font-weight:700!important;text-decoration:none;transition:background .2s,transform .15s;white-space:nowrap}
    .btn-wa:hover{background:#1ebe5d;transform:scale(1.03)}
    .btn-wa svg{width:17px;height:17px;fill:#fff;flex-shrink:0}
    .nav-burger{display:none;background:none;border:none;color:#666;font-size:1.5rem;cursor:pointer}

    /* ── HERO ── */
    .hero{position:relative;min-height:88vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;overflow:hidden}
    .hero-bg{position:absolute;inset:0;background:linear-gradient(155deg,#060606 0%,#0e1218 55%,#060606 100%);z-index:0}
    .hero-bg::before{content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 25% 55%,rgba(52,152,219,.07) 0%,transparent 60%);}
    .hero-bg::after{content:'';position:absolute;top:15%;right:49%;width:1px;height:70%;
      background:linear-gradient(to bottom,transparent,rgba(52,152,219,.3),transparent);}

    .hero-copy{position:relative;z-index:2;padding:5rem 3rem 5rem 4rem}
    .hero-eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-head);font-size:.76rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--blue);margin-bottom:1.4rem}
    .hero-eyebrow::before{content:'';width:30px;height:1px;background:var(--blue);display:block}
    .hero h1{font-family:var(--font-head);font-size:clamp(2.8rem,5.5vw,5.2rem);font-weight:800;line-height:.98;color:var(--white);margin-bottom:1rem}
    .hero h1 .accent{color:var(--blue);display:block}
    .hero h1 .year{font-size:.55em;color:#444;display:block;letter-spacing:.05em;margin-top:.3rem}
    
    /* MODIFICA: Testo bianco e grassetto */
    .hero-sub{font-size:1.05rem;font-weight:700;font-style:italic;color:var(--white);max-width:420px;margin-bottom:2.2rem;line-height:1.65}
    
    .hero-cta{display:flex;gap:1rem;flex-wrap:wrap}
    .btn-primary{display:inline-flex;align-items:center;gap:.5rem;background:var(--blue);color:#fff;font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:14px 28px;border-radius:var(--radius);transition:background .2s,transform .15s,box-shadow .2s}
    .btn-primary:hover{background:var(--blue-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(52,152,219,.28)}
    .btn-outline{display:inline-flex;align-items:center;gap:.5rem;background:transparent;border:1.5px solid #333;color:#999;font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:13px 28px;border-radius:var(--radius);transition:border-color .2s,color .2s,transform .15s}
    .btn-outline:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}

    .hero-visual{position:relative;z-index:2;height:100%;min-height:88vh;display:flex;align-items:center;justify-content:center;padding:2.5rem 2.5rem 2.5rem 1rem}
    .hero-img-stack{position:relative;width:100%;max-width:500px}
    .img-main{width:100%;height:460px;object-fit:cover;display:block;border-radius:12px;filter:brightness(.78) contrast(1.1);border:1px solid #1e1e1e}
    .img-secondary{position:absolute;bottom:-30px;left:-30px;width:220px;height:160px;object-fit:cover;border-radius:10px;border:3px solid var(--dark);filter:brightness(.85) contrast(1.05);box-shadow:0 12px 32px rgba(0,0,0,.6)}
    .img-badge{position:absolute;top:18px;right:18px;z-index:3;background:rgba(9,9,9,.88);border:1px solid rgba(52,152,219,.22);backdrop-filter:blur(8px);border-radius:var(--radius);padding:.9rem 1.2rem;text-align:center}
    .img-badge .num{font-family:var(--font-head);font-size:2.4rem;font-weight:800;color:var(--blue);line-height:1}
    .img-badge .lbl{font-family:var(--font-head);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-top:.2rem}
    .hero-img-stack::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),#2980b9,var(--blue));border-radius:0 0 12px 12px}

    /* ── SEZIONI ── */
    .section-tag{font-family:var(--font-head);font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:.5rem}
    .section-title{font-family:var(--font-head);font-size:clamp(1.8rem,3vw,2.6rem);font-weight:700;color:var(--white);margin-bottom:1.8rem}

    /* ── TRADIZIONE & INNOVAZIONE ── */
    .innovation-section{background:var(--dark);padding:5rem 4rem}
    .innov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
    .innov-card{background:var(--dark3);border:1px solid #1e1e1e;border-radius:12px;padding:2rem;position:relative;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
    .innov-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),#2980b9);transform:scaleX(0);transform-origin:left;transition:transform .35s}
    .innov-card:hover{border-color:#2a2a2a;transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
    .innov-card:hover::before{transform:scaleX(1)}
    .innov-icon{width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:1.3rem;background:var(--blue-glow);border:1px solid rgba(52,152,219,.15)}
    .innov-icon svg{width:26px;height:26px;fill:var(--blue)}
    .innov-title{font-family:var(--font-head);font-size:1.25rem;font-weight:700;color:var(--white);margin-bottom:.5rem}
    .innov-desc{font-size:.9rem;color:#777;line-height:1.7}

    /* ── SERVIZI ── */
    .services-section{background:var(--dark2);padding:5rem 4rem}
    .services-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem}
    
    /* MODIFICA: Card cliccabili */
    .service-link{text-decoration:none; display:block; color:inherit;}
    .service-card{background:var(--dark4);border:1px solid #222;border-radius:10px;padding:1.8rem;display:flex;gap:1.2rem;transition:border-color .2s,transform .2s;height:100%;}
    .service-card:hover{border-color:rgba(52,152,219,.3);transform:translateX(5px)}
    .svc-icon{width:48px;height:48px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--blue-glow);border:1px solid rgba(52,152,219,.12)}
    .svc-icon svg{width:24px;height:24px;fill:var(--blue)}
    .svc-title{font-family:var(--font-head);font-size:1.15rem;font-weight:700;color:var(--white);margin-bottom:.35rem}
    
    /* MODIFICA: Testo bianco e grassetto */
    .svc-desc{font-size:.88rem;font-weight:700;color:var(--white);line-height:1.65}

    /* ── PERCHÉ NOI ── */
    .why-section{background:var(--dark);padding:5rem 4rem;position:relative;overflow:hidden}
    .why-section::before{content:'';position:absolute;top:-60px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(52,152,219,.07),transparent 70%);pointer-events:none}
    .why-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
    .reasons-list{list-style:none}
    .reason-item{display:flex;gap:1.2rem;align-items:flex-start;padding:1.3rem 1.4rem;margin-bottom:.9rem;background:var(--dark3);border:1px solid #1e1e1e;border-radius:var(--radius);transition:border-color .2s,transform .2s}
    .reason-item:hover{border-color:rgba(52,152,219,.25);transform:translateX(4px)}
    .reason-num{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--font-head);font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .reason-title{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--white);margin-bottom:.2rem}
    .reason-desc{font-size:.87rem;color:#777;line-height:1.6}
    .cta-box{background:linear-gradient(135deg,rgba(52,152,219,.1),rgba(41,128,185,.05));border:1px solid rgba(52,152,219,.2);border-radius:14px;padding:2.6rem;text-align:center}
    .cta-box h3{font-family:var(--font-head);font-size:1.7rem;font-weight:700;color:var(--white);margin-bottom:.8rem}
    .cta-box p{font-size:.95rem;color:#888;margin-bottom:1.8rem;line-height:1.75}
    .btn-blue-full{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;background:var(--blue);color:#fff;font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:.06em;text-decoration:none;padding:14px;border-radius:var(--radius);margin-bottom:.8rem;transition:background .2s,transform .15s}
    .btn-blue-full:hover{background:var(--blue-dark);transform:translateY(-2px)}
    .btn-wa-full{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;background:#25d366;color:#fff;font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:.06em;text-decoration:none;padding:13px;border-radius:var(--radius);transition:background .2s,transform .15s}
    .btn-wa-full:hover{background:#1ebe5d;transform:translateY(-2px)}
    .btn-blue-full svg,.btn-wa-full svg{width:20px;height:20px;fill:currentColor}

    /* ── FOOTER ── */
    footer{background:#060606;border-top:1px solid #141414;padding:3rem 4rem 1.5rem}
    .footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2.5rem;margin-bottom:2.5rem}
    .footer-logo img{height:52px;margin-bottom:1rem}
    .footer-desc{font-size:.88rem;color:#4a4a4a;max-width:260px}
    .footer-col h4{font-family:var(--font-head);font-size:.76rem;letter-spacing:.15em;text-transform:uppercase;color:var(--red);margin-bottom:1rem}
    .footer-col p,.footer-col a{font-size:.88rem;color:#5a5a5a;text-decoration:none;display:block;margin-bottom:.4rem;transition:color .2s}
    .footer-col a:hover{color:var(--white)}
    .footer-bottom{border-top:1px solid #141414;padding-top:1.2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
    .footer-bottom p{font-size:.76rem;color:#333}

    /* ── RESPONSIVE ── */
    @media(max-width:1000px){
      nav{padding:0 1.2rem}
      .nav-links{display:none;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:#0a0a0a;padding:1.5rem 2rem;gap:1.2rem;border-bottom:1px solid #1a1a1a}
      .nav-links.open{display:flex}
      .nav-burger{display:block}
      .hero{grid-template-columns:1fr;min-height:auto}
      .hero-copy{padding:3rem 1.5rem 2rem}
      .hero-visual{min-height:auto;padding:0 1.5rem 3rem}
      .img-main{height:260px}
      .img-secondary{display:none}
      .innovation-section,.services-section,.why-section{padding:3rem 1.5rem}
      .why-grid{grid-template-columns:1fr}
      .innov-grid,.services-grid{grid-template-columns:1fr}
      .footer-grid{grid-template-columns:1fr 1fr;gap:2rem}
      footer{padding:2rem 1.5rem 1rem}
    }
    @media(max-width:560px){.footer-grid{grid-template-columns:1fr}.hero-cta{flex-direction:column}}
  </style>
</head>
