<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Auto | Angelucci Auto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --brand: #c1121f; --bg: #ffffff; --text: #111; }
    body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    /* Galleria Relativa per ospitare le frecce */
    .gallery { display: flex; flex-direction: column; gap: 10px; position: relative; }
    .main-view-container { position: relative; width: 100%; height: 500px; }
    #main-view { width: 100%; height: 100%; object-fit: cover; border-radius: 24px; border: 1px solid #eee; background: #f9f9f9; transition: opacity 0.3s; }
    
    /* Stile delle Frecce (Ottimizzate per Mobile Touch) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      pointer-events: all !important;
    }
    .nav-arrow:active { transform: translateY(-50%) scale(0.9); background: rgba(0, 0, 0, 0.8); }
    .left-arrow { left: 15px; }
    .right-arrow { right: 15px; }

    .thumbnails { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .thumb { width: 100%; height: 70px; object-fit: cover; border-radius: 12px; cursor: pointer; opacity: 0.6; transition: 0.3s; border: 2px solid transparent; }
    .thumb:hover, .thumb.active { opacity: 1; border-color: var(--brand); }

    /* Info */
    .header-info { display: flex; justify-content: space-between; align-items: center; margin: 30px 0; }
    h1 { font-size: clamp(24px, 5vw, 36px); margin: 0; letter-spacing: -1px; }
    .price { font-size: 32px; font-weight: 800; color: var(--brand); }
    
    .grid-specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 40px; }
    @media (min-width: 600px) { 
      .grid-specs { grid-template-columns: repeat(4, 1fr); } 
    }
    @media (max-width: 768px) {
      .main-view-container { height: 320px; } /* Più basso sui telefoni per vederlo intero */
    }

    .spec-item { background: #f8fafc; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; }
    .label { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
    .val { font-weight: 700; font-size: 16px; }

    .desc-section { border-top: 1px solid #eee; padding-top: 30px; margin-bottom: 100px; }
    .desc-text { white-space: pre-line; color: #475569; font-size: 17px; }

    /* Barra Contatti */
    .contact-bar { position: sticky; bottom: 20px; background: #111; color: #fff; padding: 15px 25px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 100; }
    .wa-btn { background: #25D366; color: #fff; padding: 12px 25px; border-radius: 999px; font-weight: 700; text-decoration: none; transition: transform 0.2s; }
    .wa-btn:hover { transform: scale(1.05); }
    .back-link { text-decoration: none; color: #64748b; font-weight: 600; display: inline-block; margin-bottom: 20px; transition: color 0.2s; }
    .back-link:hover { color: var(--brand); }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Torna alla vetrina</a>

  <div class="gallery">
    <div class="main-view-container">
      <button class="nav-arrow left-arrow" onclick="cambiaFoto(-1)"><i class="fas fa-chevron-left"></i></button>
      <img id="main-view" src="https://via.placeholder.com/1000x500?text=Caricamento..." alt="Foto principale">
      <button class="nav-arrow right-arrow" onclick="cambiaFoto(1)"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div id="thumb-list" class="thumbnails"></div>
  </div>

  <div class="header-info">
    <h1 id="auto-modello">Caricamento...</h1>
    <div class="price" id="auto-prezzo"></div>
  </div>

  <div class="grid-specs">
    <div class="spec-item"><span class="label">Anno</span><span class="val" id="auto-anno">-</span></div>
    <div class="spec-item"><span class="label">Km</span><span class="val" id="auto-km">-</span></div>
    <div class="spec-item"><span class="label">Alimentazione</span><span class="val" id="auto-alimentazione">-</span></div>
    <div class="spec-item"><span class="label">Cambio</span><span class="val" id="auto-cambio">-</span></div>
  </div>

  <div class="desc-section">
    <h3>Descrizione Veicolo</h3>
    <div id="auto-descrizione" class="desc-text"></div>
  </div>

  <div class="contact-bar">
    <span>Ti interessa questa auto?</span>
    <a id="wa-link" href="#" class="wa-btn" target="_blank">WhatsApp</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://xuxpnzaarkoymrvwabxy.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eHBuemFhcmtveW1ydndhYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDg0NzQsImV4cCI6MjA5MzA4NDQ3NH0.5RCrbajUxvztZIZX7ZHff2WIPK-kg9v7WJ7litfQNyw';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const autoId = urlParams.get('id');

  // Variabili globali per gestire lo scorrimento delle foto
  let listaImmagini = [];
  let indiceCorrente = 0;

  async function loadDetail() {
    if (!autoId) return;

    const { data: auto, error } = await _supabase
      .from('auto')
      .select('*')
      .eq('id', autoId)
      .single();

    if (auto) {
      document.getElementById('auto-modello').innerText = auto.modello;
      document.getElementById('auto-prezzo').innerText = '€' + Number(auto.prezzo).toLocaleString('it-IT');
      document.getElementById('auto-anno').innerText = auto.anno;
      document.getElementById('auto-km').innerText = Number(auto.km).toLocaleString('it-IT');
      document.getElementById('auto-alimentazione').innerText = auto.alimentazione;
      document.getElementById('auto-cambio').innerText = auto.cambio;
      document.getElementById('auto-descrizione').innerText = auto.descrizione || "";
      document.getElementById('wa-link').href = "https://wa.me/393330000000?text=Info%20" + encodeURIComponent(auto.modello);

      const cartella = auto.cartella_foto ? auto.cartella_foto.trim() : null;
      
      if (!cartella) {
        alert("Errore: La colonna 'cartella_foto' su Supabase è VUOTA per questa auto.");
        return;
      }

      const { data: files, error: sError } = await _supabase.storage
        .from('veicoli')
        .list(cartella);

      if (sError) {
        alert("Errore tecnico Storage: " + sError.message);
        return;
      }

      if (!files || files.length === 0) {
        alert("Nessuna foto trovata nella cartella: '" + cartella + "'");
        return;
      }

      const mainView = document.getElementById('main-view');
      const thumbList = document.getElementById('thumb-list');
      thumbList.innerHTML = '';

      // Filtriamo e salviamo i link reali nella nostra variabile globale
      const immaginiValide = files.filter(f => f.name !== '.empty');
      listaImmagini = immaginiValide.map(file => `${SUPABASE_URL}/storage/v1/object/public/veicoli/${cartella}/${file.name}`);

      if (listaImmagini.length > 0) {
        mainView.src = listaImmagini[0];
      }

      // Generiamo le miniature sotto
      listaImmagini.forEach((url, index) => {
        const img = document.createElement('img');
        img.src = url;
        img.className = 'thumb' + (index === 0 ? ' active' : '');
        img.onclick = () => { selezionaFoto(index); };
        thumbList.appendChild(img);
      });
    }
  }

  // Funzione per aggiornare la foto quando clicchi una miniatura o usi le frecce
  function selezionaFoto(index) {
    if (index < 0 || index >= listaImmagini.length) return;
    indiceCorrente = index;
    
    // Aggiorna la vista principale
    document.getElementById('main-view').src = listaImmagini[indiceCorrente];
    
    // Aggiorna lo stato "attivo" visivo sulle miniature sotto
    const thumbs = document.querySelectorAll('.thumb');
    thumbs.forEach((t, i) => {
      if (i === indiceCorrente) t.classList.add('active');
      else t.classList.remove('active');
    });
  }

  // Funzione collegata direttamente alle nuove frecce destre/sinistre
  function cambiaFoto(direzione) {
    if (listaImmagini.length === 0) return;
    let nuovoIndice = indiceCorrente + direzione;
    
    // Se finiscono le foto a destra torna alla prima, se finiscono a sinistra va all'ultima
    if (nuovoIndice >= listaImmagini.length) nuovoIndice = 0;
    if (nuovoIndice < 0) nuovoIndice = listaImmagini.length - 1;
    
    selezionaFoto(nuovoIndice);
  }

  loadDetail();
</script>
</body>
</html>
