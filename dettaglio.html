<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Auto | Angelucci Auto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #fff; color: #111; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-weight: 600; }
    .main-img { width: 100%; border-radius: 24px; object-fit: cover; max-height: 500px; border: 1px solid #eee; }
    .header-info { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
    h1 { font-size: 32px; margin: 0; letter-spacing: -1px; }
    .price { font-size: 28px; font-weight: 800; color: #111; }
    .grid-specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 30px 0; }
    .spec-item { background: #f8fafc; padding: 15px; border-radius: 16px; text-align: center; }
    .spec-label { display: block; font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .spec-value { font-weight: 700; }
    .description { line-height: 1.8; color: #374151; font-size: 17px; border-top: 1px solid #eee; padding-top: 30px; }
    .contact-bar { position: sticky; bottom: 20px; background: #111; color: #fff; padding: 15px 25px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .contact-bar a { color: #fff; text-decoration: none; font-weight: 700; background: #25D366; padding: 8px 15px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← Torna alla lista</a>
    <img id="auto-foto" class="main-img" src="" alt="Foto auto">
    
    <div class="header-info">
      <h1 id="auto-modello">Caricamento...</h1>
      <div class="price" id="auto-prezzo"></div>
    </div>

    <div class="grid-specs">
      <div class="spec-item"><span class="spec-label">Anno</span><span class="spec-value" id="auto-anno">-</span></div>
      <div class="spec-item"><span class="spec-label">Chilometri</span><span class="spec-value" id="auto-km">-</span></div>
      <div class="spec-item"><span class="spec-label">Alimentazione</span><span class="spec-value" id="auto-alimentazione">-</span></div>
      <div class="spec-item"><span class="spec-label">Cambio</span><span class="spec-value" id="auto-cambio">-</span></div>
    </div>

    <div class="description">
      <h3>Descrizione del veicolo</h3>
      <p id="auto-descrizione"></p>
    </div>

    <div class="contact-bar">
      <span>Ti interessa questa auto?</span>
      <a id="whatsapp-link" href="#">Contatta su WhatsApp</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xuxpnzaarkoymrvwabxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eHBuemFhcmtveW1ydndhYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDg0NzQsImV4cCI6MjA5MzA4NDQ3NH0.5RCrbajUxvztZIZX7ZHff2WIPK-kg9v7WJ7litfQNyw';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Prende l'ID dell'auto dall'indirizzo della pagina
    const urlParams = new URLSearchParams(window.location.search);
    const autoId = urlParams.get('id');

    async function loadDetail() {
      const { data, error } = await _supabase
        .from('auto')
        .select('*')
        .eq('id', autoId)
        .single();

      if (data) {
        document.getElementById('auto-modello').innerText = data.modello;
        document.getElementById('auto-prezzo').innerText = '€' + Number(data.prezzo).toLocaleString('it-IT');
        document.getElementById('auto-anno').innerText = data.anno;
        document.getElementById('auto-km').innerText = Number(data.km).toLocaleString('it-IT');
        document.getElementById('auto-alimentazione').innerText = data.alimentazione;
        document.getElementById('auto-cambio').innerText = data.cambio;
        document.getElementById('auto-descrizione').innerText = data.descrizione || "Contattaci per maggiori informazioni su questo veicolo.";
        document.getElementById('auto-foto').src = data.foto_url;
        document.getElementById('whatsapp-link').href = "https://wa.me/393330000000?text=Sono%20interessato%20a%20" + encodeURIComponent(data.modello);
        document.title = data.modello + " | Angelucci Auto";
      }
    }
    loadDetail();
  </script>
</body>
</html>
