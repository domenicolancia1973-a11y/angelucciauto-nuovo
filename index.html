<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angelucci Auto | Auto usate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#f1f5f9;
      --soft:#ffffff;
      --brand:#111111;
      --accent:#c1121f;
      --radius:20px;
      --shadow:0 10px 30px rgba(0,0,0,.03);
      --max:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Inter',system-ui,sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    img{display:block;width:100%}
    a{text-decoration:none;color:inherit}
    .container{width:min(calc(100% - 28px),var(--max));margin:0 auto}

    /* Header Estetica Bianca */
    .header{
      position:sticky;top:0;z-index:50;
      background:rgba(255,255,255,.95);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .header-inner{
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;padding:16px 0;
    }
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em;}
    .brand-mark{
      width:42px;height:42px;border-radius:12px;background:#111;color:#fff;
      display:grid;place-items:center;font-size:14px;font-weight:800;
    }
    .brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}
    
    .nav{display:flex;gap:22px;font-size:14px;color:#374151}
    .actions{display:flex;gap:10px}
    .btn,.btn-light{
      display:inline-flex;align-items:center;justify-content:center;
      padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;transition:.2s ease;
    }
    .btn{background:#111;color:#fff;border:none}
    .btn-light{background:#fff;border:1px solid var(--line);color:#111}

    /* Hero */
    .hero{padding:40px 0}
    .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
    .hero-copy{padding:20px}
    h1{font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.04em;margin:20px 0}
    .lead{color:var(--muted);font-size:18px;line-height:1.6;margin-bottom:30px}

    /* Griglia Auto */
    .inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:30px}
    .card{
      background:#fff;border-radius:24px;overflow:hidden;
      border:1px solid var(--line);transition:transform 0.3s ease;
    }
    .card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .card img{height:220px;object-fit:cover;background:#f9f9f9}
    .card-body{padding:20px}
    .title{font-size:19px;font-weight:700;margin:0}
    .price{font-size:19px;font-weight:800;color:var(--brand)}
    .meta{margin:8px 0 16px;color:var(--muted);font-size:14px}
    .specs{display:flex;gap:8px;margin-bottom:20px}
    .spec{background:#f8fafc;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
    
    .card-actions{display:flex;gap:8px}
    .card-actions a{
      flex:1;text-align:center;padding:10px;border-radius:12px;font-size:13px;font-weight:700;
    }
    .primary{background:#111;color:#fff}
    .secondary{background:#f1f5f9;color:#111}

    @media (max-width:980px){ .inventory{grid-template-columns:1fr 1fr} .hero-grid{grid-template-columns:1fr} }
    @media (max-width:600px){ .inventory{grid-template-columns:1fr} }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <div class="brand-mark">AA</div>
        <div>Angelucci Auto<small>Selezione Usato</small></div>
      </a>
      <div class="actions">
        <a class="btn" href="https://wa.me/393330000000">WhatsApp</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <h1>Auto usate selezionate, pronte per te.</h1>
          <p class="lead">Qualità, trasparenza e assistenza. Trova la tua prossima auto tra i nostri arrivi quotidiani.</p>
          <a class="btn" href="#vetrina">Vedi Vetrina</a>
        </div>
        <!-- AGGIUNTA FOTO UFFICIO/OFFICINA -->
        <div class="hero-image">
          <img src="https://xuxpnzaarkoymrvwabxy.supabase.co/storage/v1/object/public/veicoli/officina.jpg" 
               alt="Sedi Angelucci Auto" 
               style="border-radius: var(--radius); box-shadow: var(--shadow);">
        </div>
      </div>
    </section>

    <section class="section" id="vetrina">
      <div class="container">
        <h2>Vetrina Auto</h2>
        <div class="inventory" id="inventory-container">
          <!-- Caricamento Dinamico -->
          <p>Caricamento in corso...</p>
        </div>
      </div>
    </section>
  </main>

<!-- SUPABASE INTEGRATION -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xuxpnzaarkoymrvwabxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eHBuemFhcmtveW1ydndhYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDg0NzQsImV4cCI6MjA5MzA4NDQ3NH0.5RCrbajUxvztZIZX7ZHff2WIPK-kg9v7WJ7litfQNyw';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadCars() {
      const { data, error } = await _supabase
        .from('auto')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Errore:", error);
        return;
      }

      const container = document.getElementById('inventory-container');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p>Al momento non ci sono auto disponibili.</p>';
        return;
      }

      data.forEach(auto => {
        // --- MODIFICA QUI: COSTRUIAMO IL LINK ALLA FOTO PRINCIPALE ---
        let fotoUrl = 'https://via.placeholder.com/400x300?text=Foto+non+disponibile';
        
        // Se abbiamo sia la cartella che il nome del file, creiamo il link ufficiale
        if (auto.cartella_foto && auto.foto_principale) {
          fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/veicoli/${auto.cartella_foto}/${auto.foto_principale}`;
        } else if (auto.foto_url) {
          // Questo serve come "salvagente" se hai ancora i vecchi link in foto_url
          fotoUrl = auto.foto_url;
        }

        container.innerHTML += `
          <article class="card">
            <img src="${fotoUrl}" alt="${auto.modello}" />
            <div class="card-body">
              <div style="display:flex; justify-content:space-between; align-items:start;">
                <h3 class="title">${auto.modello}</h3>
                <div class="price">€${Number(auto.prezzo).toLocaleString('it-IT')}</div>
              </div>
              <p class="meta">${auto.anno} · ${Number(auto.km).toLocaleString('it-IT')} km · ${auto.alimentazione}</p>
              <div class="specs">
                <span class="spec">${auto.cambio}</span>
              </div>
              <div class="card-actions">
                <a class="primary" href="dettaglio.html?id=${auto.id}">Dettagli</a>
                <a class="secondary" href="https://wa.me/393330000000?text=Info%20per%20${encodeURIComponent(auto.modello)}">WhatsApp</a>
              </div>
            </div>
          </article>
        `;
      });
    }

    loadCars();
  </script>
</body>
</html>
