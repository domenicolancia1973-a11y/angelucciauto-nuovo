<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutte le Auto - Angelucci Domenico</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --red: #c0392b; --dark: #0f0f0f; --light: #f4f4f2; }
        body { background: var(--dark); color: var(--light); font-family: 'Barlow', sans-serif; margin: 0; padding: 2rem; }
        .header-lista { max-width: 1200px; margin: 0 auto 3rem auto; border-bottom: 1px solid #222; padding-bottom: 1rem; }
        .back-link { color: var(--red); text-decoration: none; font-weight: bold; display: block; margin-bottom: 1rem; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; max-width: 1200px; margin: auto; }
        .car-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .car-card img { width: 100%; height: 200px; object-fit: cover; }
        .car-card-body { padding: 1.5rem; }
        .car-title { font-family: 'Barlow Condensed'; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
        .car-price { font-size: 1.8rem; color: var(--red); font-weight: 700; margin: 10px 0; }
        .btn-whatsapp { display: block; text-align: center; background: #25d366; color: white; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="header-lista">
        <a href="index.html" class="back-link">← Torna alla Home</a>
        <h1>Tutte le Auto in Vendita</h1>
    </div>

    <div id="lista-completa" class="inventory-grid">
        <!-- Qui verranno caricate le auto -->
    </div>

    <script>
        // USA LE STESSE COSTANTI DELLA HOME CHE FUNZIONA
        const SUPABASE_URL = 'https://xuxpnzaarkoymrvwabxy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eHBuemFhcmtveW1ydndhYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDg0NzQsImV4cCI6MjA5MzA4NDQ3NH0.5RCrbajUxvztZIZX7ZHff2WIPK-kg9v7WJ7litfQNyw';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchTutteLeAuto() {
            // Logica identica alla vetrina, ma senza il filtro .eq('in_vetrina', true)
            const { data, error } = await _supabase
                .from('veicoli') 
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Errore:', error);
                document.getElementById('lista-completa').innerHTML = '<p>Errore nel caricamento. Per favore riprova.</p>';
                return;
            }

            const container = document.getElementById('lista-completa');
            container.innerHTML = '';

            data.forEach(auto => {
                // Usiamo ESATTAMENTE le stesse colonne che hai confermato
                container.innerHTML += `
                    <div class="car-card">
                        <img src="${auto.foto_principale}" alt="${auto.modello}">
                        <div class="car-card-body">
                            <div class="car-title">${auto.modello}</div>
                            <p>${auto.anno} • ${auto.km ? auto.km.toLocaleString() : '0'} km • ${auto.alimentazione}</p>
                            <div class="car-price">€ ${auto.prezzo ? auto.prezzo.toLocaleString() : 'N/D'}</div>
                            <a href="https://wa.me/393333402341?text=Info per ${auto.modello}" class="btn-whatsapp">WhatsApp</a>
                        </div>
                    </div>`;
            });
        }

        fetchTutteLeAuto();
    </script>
</body>
</html>
