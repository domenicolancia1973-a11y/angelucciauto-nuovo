<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutte le Auto - Angelucci Domenico</title>
    <!-- Libreria Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --red: #c0392b; 
            --dark: #0f0f0f; 
            --dark2: #1a1a1a;
            --light: #f4f4f2; 
        }
        body { 
            background: var(--dark); 
            color: var(--light); 
            font-family: 'Barlow', sans-serif; 
            margin: 0; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 2rem; 
        }
        .header-page {
            border-bottom: 1px solid #333;
            padding-bottom: 2rem;
            margin-bottom: 3rem;
        }
        .back-link { 
            color: var(--red); 
            text-decoration: none; 
            font-weight: bold; 
            display: inline-block;
            margin-bottom: 1rem;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        h1 { 
            font-family: 'Barlow Condensed'; 
            font-size: 3rem; 
            margin: 0;
            text-transform: uppercase;
        }
        
        /* Grid Veicoli */
        .inventory-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 2.5rem; 
        }
        .car-card { 
            background: var(--dark2); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #222; 
            transition: 0.3s ease; 
        }
        .car-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--red); 
        }
        .car-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
        }
        .car-card-body { padding: 1.5rem; }
        .car-title { 
            font-family: 'Barlow Condensed'; 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: white;
        }
        .car-info { color: #888; font-size: 0.95rem; margin-bottom: 1rem; }
        .car-price { 
            font-size: 1.8rem; 
            color: var(--red); 
            font-weight: 700; 
            margin-bottom: 1.5rem; 
        }
        .btn-contact {
            display: block;
            text-align: center;
            background: #25d366;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-contact:hover { background: #1ebe5d; }

        /* Footer */
        footer { 
            margin-top: 5rem;
            background: #080808; 
            padding: 3rem 2rem; 
            border-top: 1px solid #222; 
            font-size: 0.85rem; 
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header-page">
        <a href="index.html" class="back-link">← Torna alla Home</a>
        <h1>Il Nostro Parco Auto</h1>
        <p>Trasparenza e qualità in ogni veicolo selezionato.</p>
    </header>

    <div id="lista-veicoli" class="inventory-grid">
        <!-- I dati da Supabase verranno inseriti qui -->
        <p>Caricamento dei veicoli in corso...</p>
    </div>
</div>

<footer>
    <p>Angelucci Domenico | Via della Pisana, 313, 00163 Roma (RM) | P.IVA: 09496981003</p>
</footer>

<script>
    // Configurazione Supabase
    const SUPABASE_URL = 'https://xuxpnzaarkoymrvwabxy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eHBuemFhcmtveW1ydndhYnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDg0NzQsImV4cCI6MjA5MzA4NDQ3NH0.5RCrbajUxvztZIZX7ZHff2WIPK-kg9v7WJ7litfQNyw';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function caricaTutteLeAuto() {
        const { data, error } = await _supabase
            .from('veicoli')
            .select('*')
            .order('created_at', { ascending: false }); // Mostra le ultime inserite per prime

        if (error) {
            console.error('Errore nel caricamento:', error);
            document.getElementById('lista-veicoli').innerHTML = '<p>Errore nel caricamento dei dati.</p>';
            return;
        }

        const container = document.getElementById('lista-veicoli');
        container.innerHTML = ''; // Svuota il caricamento

        if (data.length === 0) {
            container.innerHTML = '<p>Al momento non ci sono veicoli disponibili.</p>';
            return;
        }

        data.forEach(auto => {
            container.innerHTML += `
                <div class="car-card">
                    <img src="${auto.immagine_url}" alt="${auto.marca_modello}">
                    <div class="car-card-body">
                        <div class="car-title">${auto.marca_modello}</div>
                        <div class="car-info">
                            ${auto.anno} • ${auto.km.toLocaleString()} km • ${auto.alimentazione}
                        </div>
                        <div class="car-price">€ ${auto.prezzo.toLocaleString()}</div>
                        <a href="https://wa.me/393333402341?text=Salve, sono interessato alla ${auto.marca_modello}" class="btn-contact">
                            Richiedi Informazioni
                        </a>
                    </div>
                </div>`;
        });
    }

    // Avvia la funzione
    caricaTutteLeAuto();
</script>

</body>
</html>
